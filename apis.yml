aid: cointracker
name: CoinTracker
description: >-
  CoinTracker is a cryptocurrency portfolio tracker and crypto tax software that
  connects a user's exchange accounts and blockchain wallets to automatically
  track holdings, calculate cost basis and capital gains, and generate tax
  reports and IRS forms. It supports a large catalog of exchanges, wallets, and
  cryptocurrencies, and offers tax-loss harvesting, performance tracking, and
  integrations with consumer tax-filing products. For developers and partners,
  CoinTracker publishes a first-party JavaScript SDK (@cointracker/tax-kit) for
  supplying cost-basis data; its core HTTP API is offered through enterprise and
  partner integrations rather than a self-serve public developer program. This
  profile was surfaced as a VC-portfolio lead and enriched by the API Evangelist
  pipeline from publicly discoverable surfaces (npm, GitHub, status page, DNS/TLS).
